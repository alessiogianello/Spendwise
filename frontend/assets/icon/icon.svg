<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Spendwise mark: the app's crosshair-in-a-frame, white base, black details -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <g fill="none" stroke="#0A0A0A" stroke-width="40" stroke-linecap="square">
    <rect x="236" y="236" width="552" height="552"/>
    <line x1="392" y1="512" x2="632" y2="512"/>
    <line x1="512" y1="392" x2="512" y2="632"/>
  </g>
  <!-- corner ticks, like the background grid's instrumentation marks -->
  <g stroke="#0A0A0A" stroke-width="16" stroke-linecap="square">
    <line x1="120" y1="120" x2="176" y2="120"/><line x1="120" y1="120" x2="120" y2="176"/>
    <line x1="904" y1="120" x2="848" y2="120"/><line x1="904" y1="120" x2="904" y2="176"/>
    <line x1="120" y1="904" x2="176" y2="904"/><line x1="120" y1="904" x2="120" y2="848"/>
    <line x1="904" y1="904" x2="848" y2="904"/><line x1="904" y1="904" x2="904" y2="848"/>
  </g>
</svg>
